# 打 tag 推上来就出一个包（.pkg.tar.zst）挂到 Release；workflow_dispatch 手动点也行。
#
# 为什么用容器手跑 docker 而不是 container: 任务：archlinux 镜像里没有 node，
# 而 actions/checkout、action-gh-release 这些 JS action 在容器任务里需要 node，
# 会直接失败。所以任务跑在 ubuntu 上，只在里面调 docker 起 Arch。
#
# 构建目录 /build 是空的、隔离的：makepkg 默认的 $srcdir 是 startdir/src，而这个仓库
# 根目录本身就有一个 src/（Rust 源码），在仓库根跑 makepkg 会往那儿克隆、撞车。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 定版本（以 PKGBUILD 的 pkgver 为准）
        id: ver
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          test -n "$pkgver"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "tag=v$pkgver" >> "$GITHUB_OUTPUT"

      - name: tag 与 PKGBUILD 对不上就停（免得编出一个名不副实的包）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${{ steps.ver.outputs.tag }}" = "${GITHUB_REF_NAME}" || {
            echo "PKGBUILD pkgver = ${{ steps.ver.outputs.pkgver }}，但推上来的 tag 是 ${GITHUB_REF_NAME}"
            exit 1
          }

      # 手动触发时 tag 还不存在，而 PKGBUILD 的 source 就指向这个 tag，先补上。
      - name: 手动触发时补打 tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.ver.outputs.tag }}" 2>/dev/null || true
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: 在 Arch 容器里 makepkg
        run: |
          mkdir -p build
          cp PKGBUILD build/
          docker run --rm -v "$PWD/build":/build -w /build archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel rust bun git
              useradd -m builder
              # 不这样写的话 .PKGINFO 里会是 "Unknown Packager"（发行版默认把 PACKAGER 注释掉了）
              sed "s|^#\?PACKAGER=.*|PACKAGER=\"Jianlong Liu <jianlongliu@hotmail.com>\"|" \
                /etc/makepkg.conf > /build/makepkg.conf
              chown -R builder /build
              su builder -c "makepkg --config /build/makepkg.conf -f --noconfirm"
            '
          ls -l build/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: build/*.pkg.tar.zst
          if-no-files-found: error

  # macOS 只能在自己的机器上编：垫片要 Apple SDK，客户端是 bun `--single`，
  # 那个脚本只给「同平台」出产物（`item.os !== process.platform` 直接跳过）。
  # runner 是 arm64 的，所以产物是给 Apple Silicon 的（Mac mini 就是这种）。
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 定版本（同样以 PKGBUILD 为准，两个 job 必须同版本）
        id: ver
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          test -n "$pkgver"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 编译垫片
        run: cargo build --release --locked

      - name: 编译魔改客户端
        run: |
          cd vendor/opencode
          bun install --frozen-lockfile
          cd packages/cli
          bun run script/build.ts --single --skip-web-ui

      - name: 打包成 tar.gz
        run: |
          set -eu
          ver="${{ steps.ver.outputs.pkgver }}"
          root="dist/antex-$ver-macos-arm64"
          mkdir -p "$root/bin"
          cp target/release/antex "$root/bin/antex"
          client=$(ls vendor/opencode/packages/cli/dist/cli-darwin-*/bin/opencode)
          cp "$client" "$root/bin/antex-tui"
          ln -s antex-tui "$root/bin/opencode2"
          cp README.md "$root/"
          tar -C dist -czf "dist/antex-$ver-macos-arm64.tar.gz" "antex-$ver-macos-arm64"
          ls -l dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz
          if-no-files-found: error

  # 两个平台的产物一起挂上去。分开发布会在同一个 tag 上抢建 Release，所以合到这里。
  release:
    needs: [pkg, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 定 tag（同 PKGBUILD 的 pkgver）
        id: ver
        run: echo "tag=v$(sed -n 's/^pkgver=//p' PKGBUILD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 看一眼要上传什么
        run: find artifacts -type f | sort

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            artifacts/arch-pkg/*.pkg.tar.zst
            artifacts/macos/*.tar.gz
          generate_release_notes: true
