[package]
name = "antex"
version = "0.1.0"
edition = "2024"
description = "Opencode v2 server API on top of the Ante agent, so opencode's own TUI can drive Ante"
publish = false

[[bin]]
name = "antex"
path = "src/main.rs"

[dependencies]
ante-sdk = "0.2.14"
base64 = "0.22"
chrono = "0.4"
axum = "0.8"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# One-command mode ties the client's lifetime to ours (`PR_SET_PDEATHSIG`), so a
# killed shim cannot leave an orphan TUI owning the terminal. Unix-only, and
# already in the tree through tokio/reqwest — this just names it directly.
libc = "0.2"
# `/connect` only needs one round trip out — the OAuth token exchange.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
