[package]
name = "ante-opentui"
version = "0.1.0"
edition = "2024"
description = "Opencode v2 server API on top of the Ante agent, so opencode's own TUI can drive Ante"
publish = false

[[bin]]
name = "antex"
path = "src/main.rs"

[dependencies]
ante-sdk = "0.2.5"
chrono = "0.4"
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
